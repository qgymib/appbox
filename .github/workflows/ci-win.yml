# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: ci-win

on: [push, workflow_dispatch]

permissions:
  contents: read

env:
  WX_INSTALL_DIR: ${{github.workspace}}/.deps/wxWidgets

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      # Only configures and builds: the tests run in the `Test` step, so a
      # failure reports the step it belongs to. The exit code of the configure
      # command is checked by hand, because the runner only looks at the exit
      # code of the last command of the script.
      - name: Build
        env:
          CMAKE_PREFIX_PATH: ${{env.WX_INSTALL_DIR}}
        run: |
          cmake --preset ${{matrix.build_type}}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset ${{matrix.build_type}}

      # Runs from the repository root, where the test preset resolves the build
      # directory of the configuration the step above has filled.
      - name: Test
        run: ctest --preset ${{matrix.build_type}}

      # The upload names the directory which holds the collected cases, so the
      # archive keeps the directory of every case instead of flattening it into
      # its content, whatever the number of the collected directories is.
      - name: Upload the failed test cases
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed_cases_${{matrix.build_type}}
          path: ./build/${{matrix.build_type}}/test/Test-*
          if-no-files-found: ignore

      # Packs the products of the release configuration once its tests passed.
      # The package preset is the same one the `Release` workflow preset runs.
      - name: Package
        if: success() && matrix.build_type == 'Release'
        run: cpack --preset Release

      - name: Upload release artifacts
        if: success() && matrix.build_type == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: appbox_${{matrix.build_type}}
          path: ./build/Release/appbox-*.zip
          archive: false
          if-no-files-found: error
